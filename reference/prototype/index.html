<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DanceFITVN · Prototype Night Stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#141518;--sf:#1F2125;--sf2:#2A2D33;--bd:#33363D;--tx:#F4F4F2;--tx2:#8E9196;--tx3:#5E6167;--pr:#FFD028;--on:#141518;--red:#E5383B;--ok:#3DD68C;--warn:#FFB020;--dg:#FF5A5F;--info:#4DA3FF;
--disp:'Barlow Condensed','Arial Narrow',sans-serif;--body:Inter,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0B0C0E;color:var(--tx);font-family:var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid #22252a;flex-wrap:wrap}
.brand{font-family:var(--disp);font-weight:800;font-size:24px;color:var(--pr);letter-spacing:1px}
.brand small{font-family:var(--body);font-size:12px;color:var(--tx2);font-weight:600;letter-spacing:.5px;margin-left:8px}
.seg{display:flex;background:#1a1c20;border:1px solid #2a2d33;border-radius:20px;padding:3px}
.seg button{padding:6px 14px;border-radius:16px;font-size:13px;font-weight:600;color:var(--tx2)}
.seg button.on{background:var(--pr);color:var(--on)}
.tog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);cursor:pointer;user-select:none}
.tog i{width:34px;height:20px;border-radius:10px;background:#2a2d33;position:relative;transition:.2s}
.tog i:after{content:'';position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.tog.on i{background:var(--warn)}.tog.on i:after{left:17px}
.reset{font-size:13px;color:var(--tx2);border:1px solid #2a2d33;border-radius:16px;padding:6px 12px}
.note{margin-left:auto;font-size:12px;color:var(--tx3)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;gap:40px;padding:16px;overflow:hidden;min-height:0}
.col{display:flex;flex-direction:column;align-items:center;gap:10px;min-height:0;height:100%;justify-content:center}
.cap{font-size:12px;color:var(--tx2);font-weight:600;letter-spacing:1.5px;text-transform:uppercase}
.holder{position:relative}
.phone{position:absolute;left:0;top:0;width:409px;height:868px;border-radius:60px;background:#050506;border:2px solid #3A3D44;transform-origin:0 0;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.phone .island{position:absolute;left:50%;top:19px;width:124px;height:36px;margin-left:-62px;border-radius:18px;background:#000;z-index:50}
#m{position:absolute;left:8px;top:8px;width:393px;height:852px;border-radius:50px;overflow:hidden;background:var(--bg)}
.tvbox{position:absolute;left:0;top:0;width:1960px;height:1200px;transform-origin:0 0}
.tvframe{width:1960px;height:1120px;background:#050506;border:3px solid #3A3D44;border-radius:22px;padding:20px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
#tv{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);border-radius:6px}
.tvstand{width:320px;height:22px;margin:0 auto;background:#26282D;border-radius:0 0 8px 8px}
.remote{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.remote button{min-width:40px;height:34px;border-radius:17px;background:#1a1c20;border:1px solid #2a2d33;font-size:13px;font-weight:700;color:var(--tx);padding:0 12px}
.remote button:hover{border-color:var(--pr)}
.remote span{font-size:12px;color:var(--tx3)}
/* ---------- shared atoms ---------- */
.d{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.6px;line-height:1}
.eb{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx2)}
.mono{font-family:var(--mono)}
.acc{color:var(--pr)}
.muted{color:var(--tx2)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:11px;font-size:11px;font-weight:700;white-space:nowrap}
.chip.c-th{background:rgba(229,56,59,.18);color:#FF6B6E}
.chip.c-db{background:rgba(77,163,255,.18);color:var(--info)}
.chip.c-gt{background:rgba(61,214,140,.16);color:var(--ok)}
.chip.y{background:var(--pr);color:var(--on)}
.chip.k{background:rgba(0,0,0,.55);color:#fff}
.chip.okc{background:rgba(61,214,140,.16);color:var(--ok)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:14px;font-weight:800;font-size:15px;letter-spacing:1px;text-transform:uppercase;width:100%}
.btn.p{background:var(--pr);color:var(--on)}
.btn.g{border:1.2px solid var(--bd);text-transform:none;letter-spacing:0;font-weight:600}
.btn.s{background:var(--sf2);text-transform:none;letter-spacing:0;font-weight:600}
.btn.r{background:var(--dg);color:#fff}
.btn.t{color:var(--pr);text-transform:none;letter-spacing:0;font-weight:700}
.btn:active{transform:scale(.98)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.poster{position:relative;overflow:hidden;border-radius:16px;flex:none}
.poster .ring{position:absolute;border-radius:50%;border:solid rgba(255,255,255,.13)}
.poster .ttl{position:absolute;left:8%;bottom:8%;color:var(--ink,#fff);z-index:2;text-shadow:0 2px 12px rgba(0,0,0,.18)}
.poster .ttl b{display:block;font-family:var(--disp);font-weight:800;text-transform:uppercase;line-height:.95}
.poster .ttl s{text-decoration:none;display:block;font-family:var(--disp);font-weight:700;letter-spacing:1.5px;opacity:.85}
.poster svg.dn{position:absolute;bottom:6%;height:72%}
.vinyl{position:absolute;border-radius:50%;background:radial-gradient(circle,#FF6A1A 0 14%,#1a1a1a 14.5% 100%);box-shadow:inset 0 0 0 6px #1a1a1a,inset 0 0 0 7px #3a3a3a,inset 0 0 0 16px #1a1a1a,inset 0 0 0 17px #3a3a3a}
/* ---------- mobile ---------- */
#m .scr{position:absolute;inset:0;overflow:hidden}
#m .scroll{position:absolute;left:0;right:0;top:54px;bottom:0;overflow-y:auto;scrollbar-width:none;padding:0 20px 120px}
#m .scroll::-webkit-scrollbar{display:none}
.sb{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-weight:600;font-size:16px;z-index:40;pointer-events:none}
.sb .ic{display:flex;gap:6px;align-items:center}
.hi{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--tx);z-index:60;pointer-events:none}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;background:#1A1B1F;border-top:1px solid var(--bd);display:flex;z-index:30}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:8px;font-size:11px;color:var(--tx2);font-weight:500}
.tabs button .pill{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.tabs button.on{color:var(--pr);font-weight:700}.tabs button.on .pill{background:rgba(255,208,40,.16)}
.top{display:flex;align-items:center;justify-content:space-between;height:52px}
.rb{width:40px;height:40px;border-radius:50%;background:var(--sf);display:flex;align-items:center;justify-content:center;flex:none}
.rb.dk{background:rgba(0,0,0,.4);color:#fff}
.card{background:var(--sf);border-radius:16px}
.h1{font-family:var(--disp);font-weight:700;font-size:34px;text-transform:uppercase;letter-spacing:1px;line-height:1}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 12px}
.sec .d{font-size:18px;letter-spacing:1px}
.sec a{font-size:13px;color:var(--pr);font-weight:600;cursor:pointer}
.les{display:flex;align-items:center;gap:12px;min-height:58px;border-bottom:1px solid var(--bd);cursor:pointer;position:relative}
.les .no{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.les.cur{background:rgba(255,208,40,.12);margin:0 -8px;padding:0 8px;border-radius:12px;border-bottom-color:transparent}
.les.cur .no{background:var(--pr);border-color:var(--pr);color:var(--on)}
.les.w .no{color:var(--tx3)}
.les .tt{flex:1;min-width:0}
.les .tt b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.les .tt span{font-size:12px;color:var(--tx2)}
.les.cur .tt span{color:var(--pr)}
.les .dlb{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--tx3);position:relative}
.les .dlb.on{color:var(--ok)}
.les .dlb .pr{position:absolute;inset:3px}
.les.dim{opacity:.38}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx2);margin-bottom:8px}
.field label em{color:var(--dg);font-style:normal}
.inp{display:flex;align-items:center;gap:10px;height:54px;border-radius:14px;background:var(--sf);border:1px solid var(--bd);padding:0 14px;color:var(--tx2)}
.inp:focus-within{border-color:var(--pr);border-width:1.6px}
.inp.err{border-color:var(--dg);border-width:1.6px}
.inp input{flex:1;background:none;border:0;outline:0;font-size:15px;color:var(--tx);min-width:0}
.inp input::placeholder{color:var(--tx3)}
.help{font-size:12px;margin-top:7px;color:var(--dg);display:flex;gap:6px;align-items:center}
.row{display:flex;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--bd);cursor:pointer}
.row:last-child{border-bottom:0}
.row .ico{width:36px;height:36px;border-radius:10px;background:var(--sf2);display:flex;align-items:center;justify-content:center;flex:none}
.row .tt{flex:1}.row .tt b{display:block;font-size:15px;font-weight:600}.row .tt span{font-size:12px;color:var(--tx2)}
.row .val{font-size:14px;color:var(--tx2)}
.sw{width:51px;height:31px;border-radius:16px;background:var(--sf2);border:1px solid var(--bd);position:relative;flex:none;transition:.2s}
.sw:after{content:'';position:absolute;top:2.5px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--pr);border-color:var(--pr)}.sw.on:after{left:23px;background:var(--on)}
.segc{display:flex;background:var(--sf);border:1px solid var(--bd);border-radius:22px;padding:3px}
.segc button{flex:1;height:34px;border-radius:17px;font-size:13px;color:var(--tx2);font-weight:500}
.segc button.on{background:var(--pr);color:var(--on);font-weight:700}
.dim-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:70;animation:fi .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sf);border-radius:24px 24px 0 0;z-index:71;padding:14px 20px 40px;animation:su .25s ease-out;max-height:92%;overflow-y:auto}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--tx3);margin:0 auto 14px}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sheet .sh .d{font-size:22px;letter-spacing:1px}
@keyframes su{from{transform:translateY(100%)}}
@keyframes fi{from{opacity:0}}
.toast{position:absolute;left:16px;right:16px;bottom:100px;background:#F4F4F2;color:#141518;border-radius:14px;padding:13px 16px;font-size:13px;font-weight:600;z-index:90;display:flex;gap:10px;align-items:center;animation:fi .2s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.offbar{position:absolute;left:0;right:0;top:54px;height:40px;background:rgba(255,176,32,.16);color:var(--warn);display:flex;align-items:center;gap:8px;padding:0 20px;font-size:13px;font-weight:700;z-index:35}
.radio{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);margin-bottom:10px;cursor:pointer;background:var(--bg)}
.radio.on{border:1.6px solid var(--pr)}
.radio .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--tx3);flex:none;position:relative}
.radio.on .dot{border-color:var(--pr)}.radio.on .dot:after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--pr)}
.prog{height:5px;border-radius:3px;background:var(--sf2);overflow:hidden}.prog i{display:block;height:100%;background:var(--pr);border-radius:3px}
/* video stage */
.vstage{position:absolute;overflow:hidden;container-type:size;background:linear-gradient(160deg,#3A1A1C,#0E0E10)}
.vstage:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,rgba(255,208,40,.32),transparent 60%)}
.vstage .floor{position:absolute;left:0;right:0;bottom:0;height:28%;background:rgba(0,0,0,.4)}
.vstage .wall{position:absolute;inset:0 0 28% 0;background:repeating-linear-gradient(90deg,transparent 0 15.5%,rgba(255,255,255,.05) 15.5% 16%)}
.vstage .who{position:absolute;left:50%;bottom:25%;transform:translateX(-50%);height:min(42%,75cqw);transition:transform .3s}
.vstage .who svg{height:100%;animation:bop 1s ease-in-out infinite alternate;animation-play-state:paused;transform-origin:50% 100%}
.vstage.play .who svg{animation-play-state:running}
.vstage.mir .who{transform:translateX(-50%) scaleX(-1)}
@keyframes bop{0%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(0) translateY(-4%)}100%{transform:rotate(6deg) translateY(0)}}
/* auto-hide of the video controls (Q12): 3 s after the last touch while playing */
.vui{transition:opacity .25s}
.scr.vid.hid .vui{opacity:0;pointer-events:none}
.vctrl{position:absolute;left:0;right:0;bottom:0;padding:0 20px 34px;z-index:10;background:linear-gradient(transparent,rgba(0,0,0,.85) 35%)}
.scrub{position:relative;height:18px;cursor:pointer}
.scrub .tr{position:absolute;left:0;right:0;top:7px;height:4px;border-radius:2px;background:rgba(255,255,255,.3)}
.scrub .fl{position:absolute;left:0;top:7px;height:4px;border-radius:2px;background:var(--pr)}
.scrub .ab{position:absolute;top:5px;height:8px;background:rgba(229,56,59,.7);border-radius:2px}
.scrub .kn{position:absolute;top:2px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--pr)}
.vside{position:absolute;right:14px;top:300px;display:flex;flex-direction:column;gap:16px;z-index:10}
.vside button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:700;color:#fff}
.vside button i{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-style:normal}
.vside button.on i{background:var(--pr);color:var(--on)}
.beats{display:flex;gap:5px}
.beats b{flex:1;height:24px;border-radius:6px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:rgba(255,255,255,.6)}
.beats b.on{background:var(--red);color:#fff}
.wave{display:flex;align-items:center;gap:2px;height:40px;cursor:pointer}
.wave i{flex:1;border-radius:2px;background:var(--sf2)}
.wave i.on{background:var(--pr)}
.crop{position:relative;height:230px;border-radius:16px;background:#2A2D33;overflow:hidden;cursor:grab;touch-action:none}
.crop .img{position:absolute;left:50%;top:50%;width:260px;height:260px;margin:-130px 0 0 -130px;background-size:cover;background-position:center}
.crop .mask{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 99px,rgba(0,0,0,.55) 100px)}
.crop .mask:after{content:'';position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px;border:2.5px solid #fff;border-radius:50%}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:var(--sf2);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--red);cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--red);border:0}
.badge{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--sf);border-radius:16px;padding:10px 6px 12px;flex:1}
.badge b{font-size:10px;font-weight:800;letter-spacing:.6px;text-align:center}
.codebox{width:46px;height:60px;border-radius:12px;background:var(--sf);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:30px}
.codebox.f{border:1.8px solid var(--pr)}
/* ---------- TV ---------- */
#tv .scr{position:absolute;inset:0}
#tv .f{transition:transform .15s,box-shadow .15s;cursor:pointer}
#tv .f.focus{transform:scale(1.06);box-shadow:0 0 0 6px var(--pr),0 26px 50px rgba(0,0,0,.6);z-index:5;position:relative}
#tv .f.focus.flat{transform:none;box-shadow:none}
.tnav{position:absolute;top:34px;left:50%;transform:translateX(-50%);display:flex;gap:12px;padding:8px;border-radius:40px;background:rgba(255,255,255,.06);z-index:10}
.tnav .f{padding:12px 32px;border-radius:30px;font-size:28px;color:var(--tx2);font-weight:500}
.tnav .f.on{background:var(--sf2);color:var(--tx);font-weight:700}
#tv .tnav .f.focus{background:var(--pr);color:var(--on);box-shadow:none;transform:scale(1.04)}
.tlogo{position:absolute;left:90px;top:56px;font-family:var(--disp);font-weight:800;font-size:40px;color:var(--pr);letter-spacing:1px;z-index:10}
.tav{position:absolute;right:90px;top:42px;width:60px;height:60px;border-radius:50%;background:var(--pr);color:var(--on);font-weight:800;font-size:26px;display:flex;align-items:center;justify-content:center;z-index:10}
.tbtn{display:inline-flex;align-items:center;gap:14px;height:88px;padding:0 44px;border-radius:44px;background:rgba(255,255,255,.12);font-size:30px;font-weight:700}
#tv .tbtn.focus{background:var(--pr);color:var(--on);box-shadow:0 26px 50px rgba(0,0,0,.6)}
.tbtn svg.i{width:34px;height:34px}
.trow{display:flex;align-items:center;gap:26px;height:88px;padding:0 30px;border-radius:22px;background:var(--sf);margin-bottom:12px}
#tv .trow.focus{background:var(--pr);color:var(--on);box-shadow:0 20px 40px rgba(0,0,0,.5);transform:scale(1.02)}
.trow .no{width:56px;height:56px;border-radius:50%;border:3px solid var(--bd);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;flex:none}
#tv .trow.focus .no{background:var(--red);border-color:var(--red);color:#fff}
.trow .tt{flex:1}.trow .tt b{display:block;font-size:30px;font-weight:700}.trow .tt span{font-size:22px;opacity:.7}
.tpanel{position:absolute;right:60px;top:60px;bottom:60px;width:640px;background:var(--sf);border-radius:36px;padding:44px;z-index:20;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:fi .2s}
.topt{display:flex;align-items:center;justify-content:space-between;height:74px;padding:0 26px;border-radius:18px;font-size:30px;font-weight:600;margin-bottom:6px}
#tv .topt.focus{background:var(--pr);color:var(--on);box-shadow:none;transform:none}
.ttoast{position:absolute;left:50%;bottom:60px;transform:translateX(-50%);background:#F4F4F2;color:#141518;border-radius:24px;padding:22px 34px;font-size:28px;font-weight:700;z-index:90;animation:fi .2s;white-space:nowrap}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="brand">DANCEFITVN<small>Prototype · Bộ A Night Stage</small></div>
    <div class="seg" id="viewSeg">
      <button data-view="both">Cả hai</button><button data-view="mobile">Mobile</button><button data-view="tv">Apple TV</button>
    </div>
    <div class="tog" id="offTog"><i></i>Mô phỏng mất mạng</div>
    <button class="reset" id="resetBtn">↺ Làm lại từ đầu</button>
    <div class="note">Bản thử · không gửi dữ liệu đi đâu · nội dung mẫu</div>
  </div>

  else if(w) meta+=' · Đã xem';

  return `<div class="les ${cur?'cur':''} ${w?'w':''} ${dim?'dim':''}" data-act="${mode==='off'?'offTap':'playVideo'}" data-k="${k}"><span class="no">${String(l.n).padStart(2,'0')}</span><span class="tt"><b>${esc(l.song)}</b><span>${meta}</span></span>${mode==='off'?(d&&d.s==='done'?`<span style="width:32px;height:32px;border-radius:50%;background:var(--pr);color:var(--on);padding:8px 7px 8px 10px" data-act="playAudio" data-k="${k}">${PLAY}</span>`:`<span style="color:var(--tx2)">${ic('cloud')}</span>`):dlb+`<span style="width:16px;color:${cur?'var(--pr)':'var(--tx)'}"><svg viewBox="0 0 24 24" style="width:16px"><path d="M6 4l14 8-14 8z" fill="${cur?'currentColor':'none'}" stroke="currentColor" stroke-width="2"/></svg></span>`}</div>`;
}

function renderM(){
  const scr=S.m.scr;
  let h=(MS[scr]||MS.home)();
  if(S.m.sheet) h+=`<div class="dim-bg" data-act="closeSheet"></div><div class="sheet"><div class="grab"></div>${SH[S.m.sheet]()}</div>`;
  if(S.m.toast) h+=`<div class="toast">${ic('info',18)}${S.m.toast}</div>`;
  h+=`<div class="hi" style="${['video'].includes(scr)&&!S.m.sheet?'background:#fff':''}"></div>`;
  const sc=$m.querySelector('.scroll'),top=sc?sc.scrollTop:0,same=$m.dataset.scr===scr;
  $m.innerHTML=h;$m.dataset.scr=scr;
  const sc2=$m.querySelector('.scroll');if(sc2&&same)sc2.scrollTop=top;
  bindM();liveM();
}
function go(scr,opt={}){
  if(opt.root){S.m.stack=[];}
  else S.m.stack.push(S.m.scr);
  if(scr!==S.m.scr||opt.root) {}
  S.m.scr=scr;S.m.sheet=null;if(scr==='video'){S.m.ctlHid=false;S.m.ctlT=Date.now()}
  if(scr!=='video'&&scr!=='audio'&&S.pm.kind==='video') S.pm.playing=false;
  renderM();const sc=$m.querySelector('.scroll');if(sc)sc.scrollTop=0;
}
function back(){S.m.sheet=null;const p=S.m.stack.pop();if(S.m.scr==='video')S.pm.playing=false;S.m.scr=p||'home';renderM()}
let mt;function toastM(msg){S.m.toast=msg;renderM();clearTimeout(mt);mt=setTimeout(()=>{S.m.toast=null;renderM()},2200)}

const CTL_HIDE_MS=3000;
function ctlHidden(){return S.m.ctlHid&&S.pm.playing&&S.pm.kind==='video'&&!S.m.sheet}

  const q=$m.querySelector('#qInp');

  const inf=$m.querySelector('#infoForm');
  if(inf) inf.onsubmit=e=>{e.preventDefault();const f=new FormData(inf);if(!f.get('first').trim()||!f.get('email').includes('@')){toastM('Tên và email là bắt buộc');return}['first','last','email','phone'].forEach(k=>S.user[k]=f.get(k).trim());back();toastM('Đã cập nhật thông tin tài khoản')};
  $m.querySelectorAll('[data-soc]').forEach(i=>i.oninput=()=>S.coach.socials[i.dataset.soc]=i.value);
  $m.querySelectorAll('[data-place]').forEach(i=>i.oninput=()=>S.coach.places[i.dataset.place]=i.value);
  const bio=$m.querySelector('#bio');if(bio)bio.oninput=()=>S.coach.bio=bio.value;
  const ci=$m.querySelector('#codeInp');
  if(ci){ci.oninput=()=>{S.m.tvCode=ci.value.toUpperCase().replace(/[^0-9A-Z]/g,'').slice(0,6);renderM();const c2=$m.querySelector('#codeInp');c2&&c2.focus()}}
  const z=$m.querySelector('#zoom');if(z)z.oninput=()=>{S.avatar.zoom=+z.value;applyCrop()};
  const cr=$m.querySelector('#crop');
  if(cr){let d=null;cr.onpointerdown=e=>{d={x:e.clientX,y:e.clientY,ox:S.avatar.x,oy:S.avatar.y,sc:phoneScale};cr.setPointerCapture(e.pointerId)};cr.onpointermove=e=>{if(!d)return;S.avatar.x=d.ox+(e.clientX-d.x)/d.sc;S.avatar.y=d.oy+(e.clientY-d.y)/d.sc;applyCrop()};cr.onpointerup=()=>d=null}

     if(!S.pm.l||key(S.pm.l)!==k){S.pm.l=l;S.pm.pos=0;S.pm.a=Math.round(l.dur*.33);S.pm.b=S.pm.a+28}S.pm.kind='video';S.pm.playing=true;S.m.set=c;
     if(S.m.scr==='video'||S.m.scr==='done'){S.m.scr='video';renderM()}else go('video')},
   playAudio:()=>{const[c,n]=k.split('-');const l=lessonsOf(c)[n-1];if(!S.pm.l||key(S.pm.l)!==k){S.pm.l=l;S.pm.pos=0}S.pm.kind='audio';S.pm.playing=true;go('audio')},
   offTap:()=>{const d=S.dl[k];if(d&&d.s==='done'){A.playAudio()}else toastM('Video bài '+k.split('-')[1].padStart(2,'0')+' cần có mạng để xem')},
   dlTap:()=>{const d=S.dl[k];if(!d){if(S.offline){toastM('Không có mạng để tải');return}S.m.sheetK=k;S.m.dlChoice='one';S.m.sheet='download';renderM()}else if(d.s==='ing'){delete S.dl[k];renderM();toastM('Đã huỷ tải')}else{S.m.sheetK=k;S.m.sheet='del';renderM()}},
   dlChoice:()=>{S.m.dlChoice=el.dataset.v;renderM()},
   dlConfirm:()=>{const k2=S.m.sheetK;if(S.m.dlChoice==='all'){lessonsOf(k2.split('-')[0]).forEach(l=>startDl(key(l)))}else startDl(k2);S.m.sheet=null;renderM();toastM('Đang tải file âm thanh…')},
   dlAll:()=>{if(S.offline){toastM('Không có mạng để tải');return}const L=lessonsOf(el.dataset.set);S.m.sheetK=key(L.find(l=>!S.dl[key(l)])||L[0]);S.m.dlChoice='all';S.m.sheet='download';renderM()},
   askDelete:()=>{S.m.sheetK=k;S.m.sheet='del';renderM()},

   togglePlay:()=>{S.pm.playing=!S.pm.playing;S.m.ctlHid=false;S.m.ctlT=Date.now();renderM()},

   seek:()=>{S.pm.pos=Math.min(S.pm.l.dur-1,Math.max(0,S.pm.pos+ +el.dataset.v));liveM()},
   mirror:()=>{S.pm.mirror=!S.pm.mirror;renderM()},loop:()=>{S.pm.loop=!S.pm.loop;if(S.pm.loop)S.pm.pos=S.pm.a;renderM()},beat:()=>{S.pm.beat=!S.pm.beat;renderM()},

function liveM(){
  const p=S.pm,pc=p.pos/p.l.dur*100;
  $m.querySelectorAll('[data-live="mpos"]').forEach(x=>x.textContent=fmt(p.pos));
  const f=$m.querySelector('[data-live="mfill"]');if(f)f.style.width=pc+'%';
  const k=$m.querySelector('[data-live="mknob"]');if(k)k.style.left=pc+'%';
  const w=$m.querySelector('#mWave');if(w)[...w.children].forEach((b,i)=>b.classList.toggle('on',i/w.children.length<=p.pos/p.l.dur));
  const bt=$m.querySelector('#mBeats');if(bt){const n=Math.floor(p.pos*2)%8;[...bt.children].forEach((b,i)=>b.classList.toggle('on',i===n))}
  Object.keys(S.dl).forEach(k=>{const d=S.dl[k];if(d.s!=='ing')return;const r=$m.querySelector(`[data-dlring="${k}"]`);if(r)r.setAttribute('stroke-dasharray',`${94.2*d.p} 94.2`);const b=$m.querySelector(`[data-dlbar="${k}"]`);if(b)b.style.width=d.p*100+'%';const t=$m.querySelector(`[data-dltxt="${k}"]`);if(t){const[c,n]=k.split('-');const l=lessonsOf(c)[n-1];t.textContent=`${(d.p*l.dur*.04).toFixed(1).replace('.',',')} / ${mb(l)} · ${Math.round(d.p*100)}%`}});
}

 [[0,0],[0,n-7],[n-7,0]].forEach(([r,cc])=>{o+=`<rect x="${cc*c}" y="${r*c}" width="${7*c}" height="${7*c}"/><rect x="${(cc+1)*c}" y="${(r+1)*c}" width="${5*c}" height="${5*c}" fill="#fff"/><rect x="${(cc+2)*c}" y="${(r+2)*c}" width="${3*c}" height="${3*c}"/>`});return `<svg viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" fill="#141518">${o}</svg>`}

function moveFocus(dir){
  const fs=[...$tv.querySelectorAll('.f')].filter(x=>!S.tv.panel||$tv.querySelector('.tpanel').contains(x));
  const cur=fs.find(x=>x.classList.contains('focus'));if(!cur){renderTV();return}
  const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let best=null,bs=1e9;
  fs.forEach(x=>{if(x===cur)return;const q=x.getBoundingClientRect(),qx=q.left+q.width/2,qy=q.top+q.height/2,dx=qx-cx,dy=qy-cy;
    let main,off;if(dir==='ArrowRight'){if(q.left<r.right-4&&dx<=4)return;main=dx;off=Math.abs(dy)}else if(dir==='ArrowLeft'){if(q.right>r.left+4&&dx>=-4)return;main=-dx;off=Math.abs(dy)}else if(dir==='ArrowDown'){if(dy<=4)return;main=dy;off=Math.abs(dx)}else{if(dy>=-4)return;main=-dy;off=Math.abs(dx)}
    if(main<=0)return;const sc=main+off*2.2;if(sc<bs){bs=sc;best=x}});
  if(best){S.tv.focus=best.dataset.fid;cur.classList.remove('focus');best.classList.add('focus');scrollTV(best)}
}
function tvKey(k){
  if(k==='Enter')tvActivate($tv.querySelector('.f.focus'));
  else if(k==='Escape'||k==='Backspace')tvBack();
  else if(k===' '){if(S.tv.scr==='player'||S.tv.scr==='music'){S.pt.playing=!S.pt.playing;renderTV()}}
  else if(k.startsWith('Arrow'))moveFocus(k);
}
document.addEventListener('keydown',e=>{if(S.view==='mobile')return;const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Escape','Backspace',' '].includes(e.key)){e.preventDefault();tvKey(e.key)}});
document.getElementById('remote').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)tvKey(b.dataset.k)});
$tv.addEventListener('click',e=>{const f=e.target.closest('.f');if(!f)return;$tv.querySelectorAll('.f.focus').forEach(x=>x.classList.remove('focus'));f.classList.add('focus');S.tv.focus=f.dataset.fid;tvActivate(f)});
function liveTV(){const p=S.pt,pc=p.pos/p.l.dur*100;$tv.querySelectorAll('[data-live="tpos"]').forEach(x=>x.textContent=fmt(p.pos));const f=$tv.querySelector('[data-live="tfill"]');if(f)f.style.width=pc+'%';
 const bt=$tv.querySelector('#tBeats');if(bt){const n=Math.floor(p.pos*2)%8;[...bt.children].forEach((b,i)=>b.classList.toggle('on',i===n))}
 const w=$tv.querySelector('#tWave');if(w)[...w.children].forEach((b,i)=>b.style.background=i/w.children.length<=p.pos/p.l.dur?'var(--pr)':'var(--sf2)')}

/* =================== CLOCK =================== */
let cdM=0,cdT=0;
setInterval(()=>{
  const dt=.25;
  [['pm','m'],['pt','t']].forEach(([pk,who])=>{const p=S[pk];if(!p.playing)return;p.pos+=dt*p.speed;
    if(p.loop&&p.kind==='video'&&p.pos>=p.b)p.pos=p.a;
    if(p.pos>=p.l.dur){p.pos=p.l.dur;p.playing=false;S.watched[key(p.l)]=1;
      if(who==='m'){if(p.kind==='video'&&S.m.scr==='video'){S.m.scr='done';cdM=5;renderM()}else renderM()}
      else{if(p.kind==='video'&&S.tv.scr==='player'){S.tv.scr='upnext';S.tv.focus=null;cdT=5;renderTV()}else renderTV()}}});
  let changed=false;Object.keys(S.dl).forEach(k=>{const d=S.dl[k];if(d.s==='ing'&&!S.offline){d.p+=0.035;if(d.p>=1){d.s='done';changed=true}}});
  if(changed&&!S.m.sheet&&!['info','coach','connect','courses'].includes(S.m.scr))renderM();
  if(S.m.scr==='video'&&!S.m.ctlHid&&S.pm.playing&&S.pm.kind==='video'&&!S.m.sheet&&Date.now()-(S.m.ctlT||0)>=CTL_HIDE_MS){S.m.ctlHid=true;applyCtl()}
  liveM();liveTV();
},250);
setInterval(()=>{
  if(S.m.scr==='done'&&cdM>0){cdM--;const e=$m.querySelector('[data-live="cd"]');if(e)e.textContent=cdM;if(cdM===0&&S.prefs.auto){const l=S.pm.l,L=lessonsOf(l.cid);if(L[l.n]){S.pm.l=L[l.n];S.pm.pos=0;S.pm.playing=true;S.m.scr='video';S.m.ctlHid=false;S.m.ctlT=Date.now();renderM()}}}
  if(S.tv.scr==='upnext'&&cdT>0){cdT--;const e=$tv.querySelector('[data-live="tcd"]');if(e)e.textContent=cdT;if(cdT===0&&S.prefs.auto){const l=S.pt.l,L=lessonsOf(l.cid);if(L[l.n]){S.pt.l=L[l.n];S.pt.pos=0;S.pt.playing=true;S.tv.scr='player';S.tv.focus='p1';renderTV()}}}
},1000);

/* =================== LAYOUT / TOOLBAR =================== */
let phoneScale=1;
function layout(){
  const v=S.view,st=document.getElementById('stage');
  document.getElementById('colM').style.display=v==='tv'?'none':'flex';
  document.getElementById('colT').style.display=v==='mobile'?'none':'flex';
  document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  const H=st.clientHeight-70,W=st.clientWidth-40;
  let pw=W,tw=W;if(v==='both'){pw=Math.min(W*.3,H*409/868);tw=W-pw-40}
  phoneScale=Math.min(H/868,pw/409);
  const ph=document.getElementById('phone');ph.style.transform=`scale(${phoneScale})`;
  const hm=document.getElementById('holdM');hm.style.width=409*phoneScale+'px';hm.style.height=868*phoneScale+'px';
  const ts=Math.min((H-50)/1142,tw/1960);
  document.getElementById('tvbox').style.transform=`scale(${ts})`;
  const ht=document.getElementById('holdT');ht.style.width=1960*ts+'px';ht.style.height=1142*ts+'px';
}
document.getElementById('viewSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.view=b.dataset.view;layout()};
document.getElementById('offTog').onclick=function(){S.offline=!S.offline;this.classList.toggle('on',S.offline);
  if(S.offline){if(S.m.scr==='video'){S.pm.playing=false;S.m.scr='offline';}else if(S.m.scr==='detail')S.m.scr='offline';
    if(S.tv.scr==='player'){S.pt.playing=false;S.tv.stack.push('player');S.tv.scr='error';S.tv.focus=null}}
  else{if(S.m.scr==='offline')S.m.scr='detail'}
  renderM();renderTV()};
document.getElementById('resetBtn').onclick=()=>{const v=S.view;initState();S.view=v;document.getElementById('offTog').classList.remove('on');renderM();renderTV();setTimeout(()=>{if(S.m.scr==='splash'){S.m.scr='login';renderM()}},1300)};
addEventListener('resize',layout);
layout();renderM();renderTV();
setTimeout(()=>{if(S.m.scr==='splash'){S.m.scr='login';renderM()}},1300);
</script>
